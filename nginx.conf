server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Không bao giờ lưu cache cho Service Worker, Manifest và index.html để điện thoại luôn nhận bản PWA mới nhất
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri =404;
    }

    # Lưu cache dài hạn (1 năm) cho các gói JS/CSS đã gắn mã băm của Vite
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fix lỗi 404 khi truy cập các route con của React (SPA Routing) - Không cache HTML gốc
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Bật nén gzip tối ưu băng thông di động
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/manifest+json
        image/svg+xml;
}
