services:
  chattikovia-web:
    build:
      context: .
      args:
        - VITE_API_URL=https://api-chat.bonix.site/api
    container_name: tiko-chattikovia-web
    restart: always
    ports:
      - "5001:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
